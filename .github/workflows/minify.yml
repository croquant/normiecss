name: Minify CSS

# normie.min.css is a build artifact, produced here in CI.
# It is never a dev dependency; never edit it by hand.

on:
  push:
    branches: [master]
    paths: [normie.css]

permissions:
  contents: write

jobs:
  minify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npx -y csso-cli normie.css -o normie.min.css
      - name: Commit minified build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add normie.min.css
          git diff --cached --quiet && exit 0
          git commit -m "chore: rebuild normie.min.css"
          git push
