name: Release

# On every push to master touching normie.css: rebuild normie.min.css,
# commit it, then tag that commit and cut a release.
# Default bump is patch; #minor or #major in the commit message
# bumps those instead. Can also be run manually.

on:
  push:
    branches: [master]
    paths: [normie.css]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed to see all tags

      # The minified build must land BEFORE the tag, otherwise the tag
      # (and the jsDelivr CDN serving it) ships a stale normie.min.css.
      - name: Rebuild and commit normie.min.css
        run: |
          npx -y csso-cli normie.css -o normie.min.css
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add normie.min.css
          git diff --cached --quiet || {
            git commit -m "chore: rebuild normie.min.css"
            git push origin HEAD:master
          }

      - name: Compute next version
        id: v
        run: |
          last=$(git tag --sort=-v:refname | head -1)
          last=${last:-0.0.0}
          major=${last%%.*}; rest=${last#*.}; minor=${rest%%.*}; patch=${rest##*.}
          msg="${{ github.event.head_commit.message }}"
          case "$msg" in
            *"#major"*) major=$((major+1)); minor=0; patch=0;;
            *"#minor"*) minor=$((minor+1)); patch=0;;
            *)          patch=$((patch+1));;
          esac
          echo "tag=$major.$minor.$patch" >> "$GITHUB_OUTPUT"

      - name: Tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.v.outputs.tag }}"
          git tag "$tag"
          git push origin "$tag"
          gh release create "$tag" --title "$tag" --generate-notes
